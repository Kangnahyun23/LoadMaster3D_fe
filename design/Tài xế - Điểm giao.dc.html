<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#F0EEE9;color:#111827;font:400 16px/24px "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2563EB;text-decoration:underline;text-underline-offset:2px}a:hover{color:#1D4ED8}
h1,h2,h3,p{margin:0}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="{{ devW }}" height="{{ devH }}" hint-size="390px,844px">
  <div data-screen-label="Tài xế · Điểm giao 2/4" style="height:844px;display:flex;flex-direction:column;background:#FFFFFF;font:400 16px/24px 'Be Vietnam Pro',sans-serif;color:#111827">

    <!-- Header -->
    <div style="flex:none;padding:58px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #E5E7EB;background:#fff">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:32px;height:32px;border-radius:50%;background:#56B4E9;color:#111827;display:grid;place-items:center;font:600 16px/1 'JetBrains Mono',monospace;flex:none">2</span>
          <h1 style="font:600 20px/28px 'Be Vietnam Pro',sans-serif">Điểm <span style="font-family:'JetBrains Mono',monospace">2 / 4</span></h1>
        </div>
        <span style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9999px;background:#FFF7ED;color:#B45309;border:1px solid #FED7AA;font:500 14px/1 'Be Vietnam Pro',sans-serif;white-space:nowrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7 7 0 0 0 8.5 4.5"></path></svg>
          3 thao tác chờ đồng bộ
        </span>
      </div>
      <div style="display:flex;gap:4px">
        <span style="flex:1;height:4px;border-radius:2px;background:#16A34A"></span>
        <span style="flex:1;height:4px;border-radius:2px;background:#56B4E9"></span>
        <span style="flex:1;height:4px;border-radius:2px;background:#E5E7EB"></span>
        <span style="flex:1;height:4px;border-radius:2px;background:#E5E7EB"></span>
      </div>
    </div>

    <!-- Scrollable content -->
    <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px 16px 16px">
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.06);padding:16px;display:flex;align-items:center;gap:12px;flex:none">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:600 20px/28px 'Be Vietnam Pro',sans-serif">Siêu thị Hoàng Gia</span>
          <span style="font:400 16px/22px 'Be Vietnam Pro',sans-serif;color:#4B5563;text-wrap:pretty">12 Lê Văn Việt, TP Thủ Đức</span>
        </div>
        <button aria-label="Gọi điện" style="width:56px;height:56px;display:grid;place-items:center;border-radius:8px;border:1px solid #E5E7EB;background:#fff;color:#111827;cursor:pointer;flex:none" style-hover="background:#F7F8FA">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg>
        </button>
        <button aria-label="Chỉ đường" style="width:56px;height:56px;display:grid;place-items:center;border-radius:8px;border:none;background:#2563EB;color:#fff;cursor:pointer;flex:none" style-hover="background:#1D4ED8">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8z"></path></svg>
        </button>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;padding:4px 2px 0;flex:none">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font:500 16px/24px 'Be Vietnam Pro',sans-serif">Cần dỡ <span style="font-family:'JetBrains Mono',monospace">24</span> kiện · Đã dỡ <span style="font-family:'JetBrains Mono',monospace;color:#15803D">{{ doneCount }}</span></span>
          <span style="font:500 16px/24px 'JetBrains Mono',monospace;color:#6B7280">{{ donePct }}</span>
        </div>
        <div style="height:8px;border-radius:9999px;background:#F7F8FA;border:1px solid #E5E7EB;overflow:hidden"><div style="width:{{ donePct }};height:100%;background:#16A34A;transition:width .2s"></div></div>
      </div>

      <div style="display:flex;flex-direction:column;flex:none;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;background:#fff">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;min-height:80px;border-bottom:1px solid #E5E7EB;background:{{ it.rowBg }}">
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font:600 16px/22px 'JetBrains Mono',monospace;color:{{ it.codeColor }};text-decoration:{{ it.deco }}">{{ it.code }}</span>
                <sc-if value="{{ it.rejected }}" hint-placeholder-val="{{ false }}">
                  <span style="display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:9999px;background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;font:600 14px/1 'Be Vietnam Pro',sans-serif;white-space:nowrap">Khách từ chối nhận</span>
                </sc-if>
              </div>
              <span style="font:400 16px/22px 'Be Vietnam Pro',sans-serif;color:{{ it.descColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.desc }}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;font:400 16px/22px 'Be Vietnam Pro',sans-serif;color:#6B7280">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5M12 22V12"></path></svg>
                {{ it.where }}
              </span>
            </div>
            <button aria-label="{{ it.btnLabel }}" onClick="{{ it.toggle }}" style="width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer;border:{{ it.btnBorder }};background:{{ it.btnBg }};color:{{ it.btnFg }}">
              <sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
              <sc-if value="{{ it.rejected }}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></sc-if>
              <sc-if value="{{ it.pending }}" hint-placeholder-val="{{ true }}"><span style="font:600 14px/1 'Be Vietnam Pro',sans-serif">Đã dỡ</span></sc-if>
            </button>
          </div>
        </sc-for>
      </div>
      <span style="font:400 16px/24px 'Be Vietnam Pro',sans-serif;color:#6B7280;text-align:center;padding:4px 0 8px;flex:none">Còn {{ remaining }} kiện chưa dỡ</span>
    </div>

    <!-- Fixed bottom -->
    <div style="flex:none;background:#fff;border-top:1px solid #E5E7EB;box-shadow:0 -4px 12px rgba(16,24,40,.06)">
      <div style="padding:12px 16px">
        <button style="display:flex;align-items:center;justify-content:center;gap:10px;height:60px;width:100%;border-radius:8px;border:none;background:#2563EB;color:#fff;font:600 18px/24px 'Be Vietnam Pro',sans-serif;letter-spacing:.02em;cursor:pointer" style-hover="background:#1D4ED8">
          HOÀN TẤT ĐIỂM GIAO
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </button>
      </div>
      <nav style="display:grid;grid-template-columns:repeat(4,1fr);height:64px;border-top:1px solid #E5E7EB;padding-bottom:0">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:{{ t.color }};font:{{ t.font }}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg>
            {{ t.label }}
          </a>
        </sc-for>
      </nav>
      <div style="height:34px"></div>
    </div>
  </div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { done: { 'PKG-00201': true, 'PKG-00202': true, 'PKG-00203': true } };
  renderVals() {
    const done = this.state.done;
    const data = [
      ['PKG-00201', 'Thùng sữa tươi 12 hộp', 'Gần cửa, lớp trên'],
      ['PKG-00202', 'Thùng mì gói 30 gói', 'Gần cửa, lớp trên'],
      ['PKG-00203', 'Nước suối 24 chai', 'Gần cửa, lớp dưới'],
      ['PKG-00204', 'Dầu ăn 5 L × 4 can', 'Giữa xe, lớp dưới', true],
      ['PKG-00205', 'Bánh kẹo tổng hợp', 'Giữa xe, lớp trên'],
      ['PKG-00206', 'Gạo 25 kg', 'Giữa xe, sàn'],
      ['PKG-00207', 'Nước giặt 3,8 L × 6', 'Giữa xe, lớp trên'],
      ['PKG-00208', 'Giấy vệ sinh 10 cuộn × 4', 'Sát vách trước, lớp trên'],
    ];
    const items = data.map(([code, desc, where, rejected]) => {
      const isDone = !!done[code] && !rejected;
      const pending = !isDone && !rejected;
      return {
        code, desc, where, rejected: !!rejected, done: isDone, pending,
        rowBg: rejected ? '#FEF2F2' : isDone ? '#F7F8FA' : '#fff',
        codeColor: isDone ? '#6B7280' : '#111827', descColor: isDone ? '#6B7280' : '#4B5563', deco: isDone ? 'line-through' : 'none',
        btnBorder: isDone ? 'none' : rejected ? '2px solid #FECACA' : '2px solid #16A34A',
        btnBg: isDone ? '#16A34A' : rejected ? '#fff' : '#fff',
        btnFg: isDone ? '#fff' : rejected ? '#DC2626' : '#15803D',
        btnLabel: isDone ? 'Bỏ đánh dấu đã dỡ' : 'Đánh dấu đã dỡ',
        toggle: rejected ? undefined : () => this.setState({ done: { ...done, [code]: !done[code] } }),
      };
    });
    const visibleDone = items.filter(i => i.done).length;
    const doneCount = 6 + visibleDone; // 6 more already unloaded further down the list
    const tabDefs = [
      ['Chuyến', 'M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14M15 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0M5 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0'],
      ['Điểm giao', 'M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0M9 10a3 3 0 1 0 6 0 3 3 0 1 0-6 0'],
      ['Kiện hàng', 'M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Zm-17.7-1 8.7 5 8.7-5M12 22V12'],
      ['Tài khoản', 'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M8 7a4 4 0 1 0 8 0 4 4 0 1 0-8 0'],
    ];
    const tabs = tabDefs.map(([label, d], i) => ({ label, d, color: i === 1 ? '#1D4ED8' : '#4B5563', font: (i === 1 ? '600' : '500') + " 14px/18px 'Be Vietnam Pro',sans-serif" }));
    return { devW: 390, devH: 844, items, tabs, doneCount, donePct: Math.round(doneCount / 24 * 100) + '%', remaining: 24 - doneCount - 1 };
  }
}
</script>
</body>
</html>
