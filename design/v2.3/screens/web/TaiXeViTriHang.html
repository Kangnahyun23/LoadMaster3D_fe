<!doctype html><html lang="vi"><head><meta charset="utf-8"><!-- Tài xế · xem vị trí hàng · 390×844 --><title>Xem vị trí hàng</title>
<link rel="stylesheet" href="../../tokens/fonts.css"><link rel="stylesheet" href="../../tokens/v3.css">
<style>
body { width: 390px; }
.wrap { padding: 0 28px 28px; margin-top: -44px; position: relative; }

body { background: #dfe8eb; font-size: 16px; line-height: 24px; }
/* thanh trên trên dải trời: nút đặc cỡ chạm, không kính */
.tb { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #e7fcfd;
  background: #0b3945; border: 1px solid #235a69; }
.lng { height: 56px; min-width: 56px; padding: 0 14px 0 12px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; flex: none; color: #e7fcfd; background: #0b3945; border: 1px solid #235a69; font: 600 16px/1 var(--text); letter-spacing: .04em; }
.lng svg { color: var(--cyan-200); }
.lng.sq { padding: 0; width: 56px; }
.me { width: 56px; height: 56px; display: grid; place-items: center; flex: none; border-radius: 50%; }
.me .avatar { width: 46px; height: 46px; font-size: 16px; }
/* nút cỡ chạm */
.btn.t56 { height: 56px; padding: 0 20px; border-radius: 14px; font-size: 17px; gap: 10px; justify-content: center; }
.btn.t60 { height: 60px; padding: 0 22px; border-radius: 16px; font-size: 18px; gap: 10px; justify-content: center; }
.btn.t64 { height: 64px; padding: 0 26px; border-radius: 16px; font-size: 19px; gap: 12px; justify-content: center; }
.btn.is-dis { opacity: 1; box-shadow: none; background: var(--n-100); border-color: var(--n-200); color: var(--n-600); }
/* trạng thái cỡ hiện trường */
.st { height: 32px; padding: 0 12px 0 11px; font-size: 16px; gap: 8px; border-radius: 9px; }
.st i { width: 8px; height: 8px; }
.code.pl { font-size: 16px; color: var(--ink-2); }
.help { font-size: 16px; line-height: 21px; }
.ftag { height: 26px; padding: 0 9px; font-size: 14px; border-radius: 7px; }

.phone { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--app); display: flex; flex-direction: column; }
.phd { flex: none; padding: 8px 12px 12px; color: #fff; }
.phd .row { display: flex; align-items: center; gap: 8px; height: 56px; }
.phd .ttl { flex: 1; min-width: 0; }
.phd h1 { margin: 0; font: 700 22px/26px var(--display); font-stretch: 104%; letter-spacing: -.3px; white-space: nowrap; }
.phd .sub { font-size: 16px; line-height: 20px; color: rgba(203,247,249,.8); margin-top: 1px; white-space: nowrap; }
.strip { display: flex; gap: 6px; margin: 10px 4px 0; }
.strip i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); }
.strip i.cur { background: var(--s1); box-shadow: 0 0 10px rgba(230,159,0,.55); }
.strip i.done { background: var(--green-500); }
.smk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 700 17px/1 var(--display); color: #101828; }
.smk.s1 { background: var(--s1); } .smk.s2 { background: var(--s2); } .smk.s3 { background: var(--s3); }
.pbody { flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; }
.pbody > * { flex: none; }
.pfoot { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px 14px; box-shadow: 0 -10px 24px -18px rgba(2,34,45,.35); }
.pfoot .btn { width: 100%; }

.phone { background: #021a22; }
.stage { position: absolute; inset: 0; background: #021a22 url(../img/scene-driver.jpg) 0 0 / 390px 844px no-repeat; }
.g3 { position: absolute; z-index: 2; border-radius: 18px; }
.g3.top { left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 8px; }
.g3 .xb { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #e7fcfd;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
.g3 .tt { flex: 1; min-width: 0; }
.g3 .tt b { display: block; font: 650 17px/22px var(--display); font-stretch: 104%; color: #fff; }
.g3 .tt span { display: block; font-size: 16px; line-height: 21px; color: rgba(203,247,249,.85); }
.cam { position: absolute; z-index: 2; right: 10px; top: 112px; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  border-radius: 14px; font-size: 16px; font-weight: 500; color: #e7fcfd; }
.cam svg { color: var(--cyan-200); }
.pinl { position: absolute; z-index: 2; padding: 7px 11px; border-radius: 11px; font-size: 16px; line-height: 21px; color: #e7fcfd; }
.pinl b { display: block; color: #fff; font-weight: 600; font-size: 16px; }
.pinl .code { color: var(--cyan-200); font-size: 16px; }
.pinl .sw1 { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: var(--s1); margin-right: 7px; }
.lead { position: absolute; z-index: 2; width: 2px; background: linear-gradient(var(--cyan-300), rgba(92,219,230,0)); }
.dot { position: absolute; z-index: 2; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--cyan-300);
  box-shadow: 0 0 0 5px rgba(0,195,212,.22), 0 0 16px var(--cyan-400); }
.g3.bot { left: 10px; right: 10px; bottom: 10px; padding: 12px 12px 12px; }
.bot .l1 { font-size: 16px; line-height: 21px; color: rgba(203,247,249,.85); }
.bot .l1 b { display: block; font: 650 16px/22px var(--display); font-stretch: 104%; color: #fff; }
.bot .l2 { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bot .l2 > div { display: flex; flex-direction: column; padding: 7px 10px; border-radius: 11px; background: rgba(255,255,255,.06); border: 1px solid rgba(155,237,242,.12); }
.bot .l2 span { font-size: 16px; line-height: 20px; color: rgba(203,247,249,.8); }
.bot .l2 .code { color: #fff; font: 600 16px/22px var(--mono); margin-top: 2px; }
.bins { display: flex; gap: 3px; margin: 12px 0 12px; height: 26px; align-items: center; }
.bins i { flex: 1; height: 18px; border-radius: 4px; background: var(--s1); opacity: .35; }
.bins i.cur { height: 26px; opacity: 1; box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255,255,255,.6); }
.ctr { display: flex; align-items: center; gap: 8px; }
.ctr .cb { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; color: #e7fcfd; flex: none;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
.ctr .cb.play { background: linear-gradient(180deg, #2ed6e4, #00c3d4); color: var(--cyan-950); border-color: #00b5c6; }
.ctr .cnt { margin-left: auto; text-align: right; }
.ctr .cnt span { display: block; font-size: 16px; line-height: 20px; color: rgba(203,247,249,.8); }
.ctr .cnt b { font: 700 22px/26px var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.ctr .cnt b small { font-size: 16px; font-weight: 500; color: rgba(203,247,249,.72); }
.leg { display: flex; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(155,237,242,.16); font-size: 16px; line-height: 20px; color: rgba(231,252,253,.85); }
.leg span { display: flex; align-items: center; gap: 7px; }
.leg i { width: 12px; height: 12px; border-radius: 3px; }

</style></head><body>
<div class="phone"><div class="stage" role="img" aria-label="Mô phỏng dỡ theo thứ tự dỡ của phương án đã duyệt, vị trí kiện và cảnh báo lối dỡ."></div>
<header class="g3 top glass-dark">
  <button type="button" class="xb" aria-label="Đóng 3D"><svg class="" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <div class="tt"><b>Vị trí hàng tại điểm giao</b><span>Điểm 1 / 3 · Cửa hàng Bách Hoá Xanh Thủ Đức</span></div>
</header>
<button type="button" class="cam glass-dark" aria-label="Góc nhìn hàng: Góc chéo"><svg class="" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Góc chéo<svg class="" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<div class="pinl glass-dark" style="left:196px;top:176px"><b>Hiện tại · Điểm 1</b><span class="code">PKG-002-20</span></div>
<span class="lead" style="left:245px;top:225px;height:14px"></span>
<span class="dot" style="left:238px;top:238px" aria-hidden="true"></span>
<div class="pinl glass-dark" style="left:14px;top:318px"><b><i class="sw1"></i>Điểm 1 · 59 kiện gần cửa</b>61 kiện giữa xe</div>
<section class="g3 bot glass-dark" aria-label="Thứ tự dỡ">
  <div class="l1"><b>Thứ tự dỡ</b>Mô phỏng không đánh dấu giao hàng</div>
  <div class="l2"><div><span>Hiện tại</span><span class="code">PKG-002-20</span></div><div><span>Tiếp theo</span><span class="code">PKG-002-28</span></div></div>
  <div class="bins" aria-hidden="true"><i class="cur"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div>
  <div class="ctr">
    <button type="button" class="cb" aria-label="Về đầu"><svg class="" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg></button>
    <button type="button" class="cb" aria-label="Lùi một bước"><svg class="" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" class="cb play" aria-label="Phát"><svg class="" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
    <button type="button" class="cb" aria-label="Tiến một bước"><svg class="" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="cnt"><span>Đã dỡ</span><b>0<small> / 120</small></b></div>
  </div>
  <div class="leg"><span><i style="background:var(--s1)"></i>Điểm 1</span><span><i style="background:var(--s2)"></i>Điểm 2</span><span><i style="background:var(--s3)"></i>Điểm 3</span></div>
</section></div>
</body></html>
